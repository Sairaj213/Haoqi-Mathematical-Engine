<svg xmlns="http://www.w3.org/2000/svg" width="900" height="60" viewBox="0 0 900 60">
  <defs>
    <filter id="tg" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="900" height="60" rx="6" fill="#0A0B0D" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Grid -->
  <pattern id="tg2" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="60" rx="6" fill="url(#tg2)"/>
  
  <!-- React -->
  <g transform="translate(30,12)">
    <rect width="100" height="36" rx="4" fill="rgba(97,218,251,0.08)" stroke="rgba(97,218,251,0.25)" stroke-width="0.8"/>
    <circle cx="18" cy="18" r="4" fill="none" stroke="#61DAFB" stroke-width="1" filter="url(#tg)"/>
    <circle cx="18" cy="18" r="1.5" fill="#61DAFB"/>
    <text x="30" y="22" font-family="JetBrains Mono,monospace" font-size="10" font-weight="600" fill="#61DAFB" letter-spacing="0.5">React 19</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(150,12)">
    <rect width="120" height="36" rx="4" fill="rgba(49,120,198,0.08)" stroke="rgba(49,120,198,0.25)" stroke-width="0.8"/>
    <rect x="11" y="11" width="14" height="14" rx="2" fill="#3178C6"/>
    <text x="14" y="22" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="white">TS</text>
    <text x="32" y="22" font-family="JetBrains Mono,monospace" font-size="10" font-weight="600" fill="#3178C6" letter-spacing="0.5">TypeScript</text>
  </g>

  <!-- Vite -->
  <g transform="translate(290,12)">
    <rect width="80" height="36" rx="4" fill="rgba(189,52,254,0.08)" stroke="rgba(189,52,254,0.2)" stroke-width="0.8"/>
    <polygon points="18,8 26,26 10,26" fill="none" stroke="#BD34FE" stroke-width="1.2" filter="url(#tg)"/>
    <text x="32" y="22" font-family="JetBrains Mono,monospace" font-size="10" font-weight="600" fill="#BD34FE" letter-spacing="0.5">Vite</text>
  </g>
  
  <!-- Tailwind -->
  <g transform="translate(390,12)">
    <rect width="110" height="36" rx="4" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.2)" stroke-width="0.8"/>
    <path d="M14,16 Q18,10 22,16 Q26,22 30,16" fill="none" stroke="#38BDF8" stroke-width="1.5" filter="url(#tg)"/>
    <text x="36" y="22" font-family="JetBrains Mono,monospace" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="0.5">Tailwind</text>
  </g>

  <!-- Math.js -->
  <g transform="translate(520,12)">
    <rect width="100" height="36" rx="4" fill="rgba(0,229,255,0.08)" stroke="rgba(0,229,255,0.2)" stroke-width="0.8"/>
    <text x="12" y="22" font-family="JetBrains Mono,monospace" font-size="13" font-weight="700" fill="#00E5FF" filter="url(#tg)">∑</text>
    <text x="28" y="22" font-family="JetBrains Mono,monospace" font-size="10" font-weight="600" fill="#00E5FF" letter-spacing="0.5">Math.js</text>
  </g>
  
  <!-- Web Audio -->
  <g transform="translate(640,12)">
    <rect width="110" height="36" rx="4" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.2)" stroke-width="0.8"/>
    <path d="M12,18 L16,12 L20,24 L24,14 L28,20" fill="none" stroke="#F59E0B" stroke-width="1.2" filter="url(#tg)"/>
    <text x="34" y="22" font-family="JetBrains Mono,monospace" font-size="10" font-weight="600" fill="#F59E0B" letter-spacing="0.5">WebAudio</text>
  </g>
  
  <!-- Motion -->
  <g transform="translate(770,12)">
    <rect width="100" height="36" rx="4" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.2)" stroke-width="0.8"/>
    <circle cx="18" cy="18" r="5" fill="none" stroke="#22C55E" stroke-width="1" stroke-dasharray="3,2" filter="url(#tg)">
      <animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="22" font-family="JetBrains Mono,monospace" font-size="10" font-weight="600" fill="#22C55E" letter-spacing="0.5">Motion</text>
  </g>
</svg>
