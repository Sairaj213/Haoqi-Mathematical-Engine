<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90">
  <defs>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="90" rx="6" fill="#0A0B0D" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Grid -->
  <pattern id="mg" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="90" rx="6" fill="url(#mg)"/>

  <!-- Theme 1: Technical Light -->
  <g transform="translate(32,12)">
    <rect width="195" height="66" rx="4" fill="#F8F7F4" stroke="rgba(18,18,18,0.12)" stroke-width="1"/>
    <circle cx="20" cy="33" r="8" fill="#FFFFFF" stroke="rgba(18,18,18,0.15)" stroke-width="1"/>
    <circle cx="20" cy="33" r="4" fill="#0055FF" filter="url(#g)"/>
    <text x="38" y="28" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#121212" letter-spacing="1">TECHNICAL LIGHT</text>
    <text x="38" y="44" font-family="JetBrains Mono,monospace" font-size="8" fill="#6B7280" letter-spacing="0.5">Warm architectural plate</text>
    <!-- Color swatches -->
    <rect x="38" y="51" width="12" height="6" rx="1" fill="#F8F7F4" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
    <rect x="53" y="51" width="12" height="6" rx="1" fill="#121212"/>
    <rect x="68" y="51" width="12" height="6" rx="1" fill="#0055FF"/>
    <rect x="83" y="51" width="12" height="6" rx="1" fill="#6B7280"/>
  </g>
  
  <!-- Theme 2: Obsidian Terminal -->
  <g transform="translate(248,12)">
    <rect width="195" height="66" rx="4" fill="#121316" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
    <circle cx="20" cy="33" r="8" fill="#181A1F" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
    <circle cx="20" cy="33" r="4" fill="#00E5FF" filter="url(#g)"/>
    <text x="38" y="28" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#F4F4F5" letter-spacing="1">OBSIDIAN</text>
    <text x="38" y="44" font-family="JetBrains Mono,monospace" font-size="8" fill="#8E929B" letter-spacing="0.5">Deep space console</text>
    <rect x="38" y="51" width="12" height="6" rx="1" fill="#0A0B0D"/>
    <rect x="53" y="51" width="12" height="6" rx="1" fill="#F4F4F5"/>
    <rect x="68" y="51" width="12" height="6" rx="1" fill="#00E5FF"/>
    <rect x="83" y="51" width="12" height="6" rx="1" fill="#8E929B"/>
  </g>

  <!-- Theme 3: Blueprint -->
  <g transform="translate(464,12)">
    <rect width="195" height="66" rx="4" fill="#0C1A30" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <circle cx="20" cy="33" r="8" fill="#112340" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="20" cy="33" r="4" fill="#38BDF8" filter="url(#g)"/>
    <text x="38" y="28" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#E0F2FE" letter-spacing="1">BLUEPRINT</text>
    <text x="38" y="44" font-family="JetBrains Mono,monospace" font-size="8" fill="#7DD3FC" letter-spacing="0.5">Engineering vellum</text>
    <rect x="38" y="51" width="12" height="6" rx="1" fill="#081120"/>
    <rect x="53" y="51" width="12" height="6" rx="1" fill="#E0F2FE"/>
    <rect x="68" y="51" width="12" height="6" rx="1" fill="#38BDF8"/>
    <rect x="83" y="51" width="12" height="6" rx="1" fill="#7DD3FC"/>
  </g>
  
  <!-- Theme 4: Amber Phosphor -->
  <g transform="translate(680,12)">
    <rect width="195" height="66" rx="4" fill="#17120A" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
    <circle cx="20" cy="33" r="8" fill="#21190D" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <circle cx="20" cy="33" r="4" fill="#F59E0B" filter="url(#g)"/>
    <text x="38" y="28" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#FDE68A" letter-spacing="1">AMBER PHOSPHOR</text>
    <text x="38" y="44" font-family="JetBrains Mono,monospace" font-size="8" fill="#D97706" letter-spacing="0.5">CRT phosphor glow</text>
    <rect x="38" y="51" width="12" height="6" rx="1" fill="#0D0A05"/>
    <rect x="53" y="51" width="12" height="6" rx="1" fill="#FDE68A"/>
    <rect x="68" y="51" width="12" height="6" rx="1" fill="#F59E0B"/>
    <rect x="83" y="51" width="12" height="6" rx="1" fill="#D97706"/>
  </g>
</svg>
