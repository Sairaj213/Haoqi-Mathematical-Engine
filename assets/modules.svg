<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <filter id="mg2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="200" rx="6" fill="#0A0B0D" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <pattern id="mg3" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="200" rx="6" fill="url(#mg3)"/>

  <!-- Module 01: Expression Terminal -->
  <g transform="translate(16,14)">
    <rect width="276" height="76" rx="5" fill="url(#cardBg)" stroke="rgba(0,229,255,0.18)" stroke-width="0.8"/>
    <text x="14" y="22" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="rgba(0,229,255,0.5)" letter-spacing="1">[01]</text>
    <text x="50" y="22" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#F4F4F5" letter-spacing="1">EXPRESSION TERMINAL</text>
    <line x1="14" y1="32" x2="262" y2="32" stroke="rgba(0,229,255,0.08)" stroke-width="0.5"/>
    <text x="14" y="46" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Arithmetic · Symbolic · Variables</text>
    <text x="14" y="60" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Audit ledger · μs telemetry</text>
    <!-- Decorative > prompt -->
    <text x="230" y="60" font-family="JetBrains Mono,monospace" font-size="16" font-weight="700" fill="rgba(0,229,255,0.2)" filter="url(#mg2)">›_</text>
  </g>

  <!-- Module 02: 2D Cartesian Plot -->
  <g transform="translate(308,14)">
    <rect width="276" height="76" rx="5" fill="url(#cardBg)" stroke="rgba(56,189,248,0.18)" stroke-width="0.8"/>
    <text x="14" y="22" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="rgba(56,189,248,0.5)" letter-spacing="1">[02]</text>
    <text x="50" y="22" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#F4F4F5" letter-spacing="1">2D CARTESIAN PLOT</text>
    <line x1="14" y1="32" x2="262" y2="32" stroke="rgba(56,189,248,0.08)" stroke-width="0.5"/>
    <text x="14" y="46" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Sub-pixel canvas · Tangent f'(x)</text>
    <text x="14" y="60" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Shaded integrals · Param sliders</text>
    <!-- Decorative sine wave -->
    <path d="M220,40 Q235,25 250,40 T268,40" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>
  </g>
  
  <!-- Module 03: Matrix Lab -->
  <g transform="translate(600,14)">
    <rect width="276" height="76" rx="5" fill="url(#cardBg)" stroke="rgba(168,85,247,0.18)" stroke-width="0.8"/>
    <text x="14" y="22" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="rgba(168,85,247,0.5)" letter-spacing="1">[03]</text>
    <text x="50" y="22" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#F4F4F5" letter-spacing="1">MATRIX &amp; VECTOR LAB</text>
    <line x1="14" y1="32" x2="262" y2="32" stroke="rgba(168,85,247,0.08)" stroke-width="0.5"/>
    <text x="14" y="46" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">det(A) · Eigenvalues · Inverse</text>
    <text x="14" y="60" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Dot/Cross products · Trace</text>
    <!-- Decorative matrix bracket -->
    <text x="240" y="58" font-family="JetBrains Mono,monospace" font-size="14" fill="rgba(168,85,247,0.2)" filter="url(#mg2)">[A]</text>
  </g>

  <!-- Module 04: Calculus Engine -->
  <g transform="translate(16,106)">
    <rect width="276" height="76" rx="5" fill="url(#cardBg)" stroke="rgba(34,197,94,0.18)" stroke-width="0.8"/>
    <text x="14" y="22" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="rgba(34,197,94,0.5)" letter-spacing="1">[04]</text>
    <text x="50" y="22" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#F4F4F5" letter-spacing="1">CALCULUS ENGINE</text>
    <line x1="14" y1="32" x2="262" y2="32" stroke="rgba(34,197,94,0.08)" stroke-width="0.5"/>
    <text x="14" y="46" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Simpson's 1/3 quadrature</text>
    <text x="14" y="60" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">5-pt derivatives · Limits · Σ/Π</text>
    <!-- Decorative integral -->
    <text x="240" y="58" font-family="JetBrains Mono,monospace" font-size="18" fill="rgba(34,197,94,0.2)" filter="url(#mg2)">∫</text>
  </g>

  <!-- Module 05: Bits & IEEE-754 -->
  <g transform="translate(308,106)">
    <rect width="276" height="76" rx="5" fill="url(#cardBg)" stroke="rgba(245,158,11,0.18)" stroke-width="0.8"/>
    <text x="14" y="22" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="rgba(245,158,11,0.5)" letter-spacing="1">[05]</text>
    <text x="50" y="22" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#F4F4F5" letter-spacing="1">BITS &amp; RADIX 754</text>
    <line x1="14" y1="32" x2="262" y2="32" stroke="rgba(245,158,11,0.08)" stroke-width="0.5"/>
    <text x="14" y="46" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">32-bit IEEE-754 bitfield inspector</text>
    <text x="14" y="60" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Base conversion · Bitwise · GCD</text>
    <!-- Decorative binary -->
    <text x="228" y="58" font-family="JetBrains Mono,monospace" font-size="10" fill="rgba(245,158,11,0.2)" filter="url(#mg2)">10110</text>
  </g>

  <!-- Module 06: Statistics -->
  <g transform="translate(600,106)">
    <rect width="276" height="76" rx="5" fill="url(#cardBg)" stroke="rgba(236,72,153,0.18)" stroke-width="0.8"/>
    <text x="14" y="22" font-family="JetBrains Mono,monospace" font-size="9" font-weight="700" fill="rgba(236,72,153,0.5)" letter-spacing="1">[06]</text>
    <text x="50" y="22" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#F4F4F5" letter-spacing="1">STATISTICAL DENSITY</text>
    <line x1="14" y1="32" x2="262" y2="32" stroke="rgba(236,72,153,0.08)" stroke-width="0.5"/>
    <text x="14" y="46" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Histogram · Gaussian N(μ,σ)</text>
    <text x="14" y="60" font-family="JetBrains Mono,monospace" font-size="8" fill="rgba(255,255,255,0.35)">Linear regression · R² fit</text>
    <!-- Decorative bell curve -->
    <path d="M220,60 Q230,40 240,30 Q250,40 260,60" fill="none" stroke="rgba(236,72,153,0.2)" stroke-width="1.2"/>
  </g>
</svg>
