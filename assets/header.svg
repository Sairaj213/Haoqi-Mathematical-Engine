<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <!-- Animated gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0B0D"/>
      <stop offset="50%" style="stop-color:#0C1A30"/>
      <stop offset="100%" style="stop-color:#0D0A05"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Stronger glow for accent elements -->
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(56,189,248,0.07)" stroke-width="0.5"/>
    </pattern>
    
    <!-- Crosshair pattern for corners -->
    <pattern id="cross" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.5" fill="rgba(56,189,248,0.15)"/>
    </pattern>

    <!-- Scan line animation -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,229,255,0)" />
      <stop offset="50%" stop-color="rgba(0,229,255,0.06)" />
      <stop offset="100%" stop-color="rgba(0,229,255,0)" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)"/>
  
  <!-- Grid overlay -->
  <rect width="900" height="320" fill="url(#grid)"/>
  
  <!-- Decorative horizontal scan lines -->
  <line x1="0" y1="80" x2="900" y2="80" stroke="rgba(56,189,248,0.04)" stroke-width="0.5"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="rgba(56,189,248,0.04)" stroke-width="0.5"/>
  <line x1="0" y1="240" x2="900" y2="240" stroke="rgba(56,189,248,0.04)" stroke-width="0.5"/>

  <!-- Corner registration marks -->
  <g stroke="rgba(56,189,248,0.4)" stroke-width="1.5" fill="none">
    <!-- Top-left -->
    <line x1="16" y1="16" x2="36" y2="16"/>
    <line x1="16" y1="16" x2="16" y2="36"/>
    <!-- Top-right -->
    <line x1="884" y1="16" x2="864" y2="16"/>
    <line x1="884" y1="16" x2="884" y2="36"/>
    <!-- Bottom-left -->
    <line x1="16" y1="304" x2="36" y2="304"/>
    <line x1="16" y1="304" x2="16" y2="284"/>
    <!-- Bottom-right -->
    <line x1="884" y1="304" x2="864" y2="304"/>
    <line x1="884" y1="304" x2="884" y2="284"/>
  </g>
  
  <!-- Corner + marks -->
  <g font-family="JetBrains Mono, monospace" font-size="10" fill="rgba(56,189,248,0.3)">
    <text x="12" y="13">+</text>
    <text x="878" y="13">+</text>
    <text x="12" y="316">+</text>
    <text x="878" y="316">+</text>
  </g>
  
  <!-- Coordinate labels -->
  <g font-family="JetBrains Mono, monospace" font-size="8" fill="rgba(56,189,248,0.2)">
    <text x="44" y="20">0,0</text>
    <text x="848" y="20">900,0</text>
    <text x="44" y="310">0,320</text>
    <text x="840" y="310">900,320</text>
  </g>

  <!-- Thin border frame -->
  <rect x="12" y="12" width="876" height="296" rx="2" fill="none" stroke="rgba(56,189,248,0.12)" stroke-width="1"/>

  <!-- Inner decorative frame -->
  <rect x="50" y="42" width="800" height="236" rx="1" fill="none" stroke="rgba(56,189,248,0.06)" stroke-width="0.5" stroke-dasharray="4,8"/>

  <!-- Decorative sine wave -->
  <path d="M 60 200 Q 150 140, 240 200 T 420 200 T 600 200 T 780 200 T 840 200" 
        fill="none" stroke="rgba(0,229,255,0.08)" stroke-width="1"/>
  <path d="M 60 210 Q 180 160, 300 210 T 540 210 T 780 210 T 840 210" 
        fill="none" stroke="rgba(245,158,11,0.06)" stroke-width="0.8"/>

  <!-- Status indicator dot -->
  <circle cx="72" cy="70" r="4" fill="#22c55e" filter="url(#glowStrong)"/>
  
  <!-- System status text -->
  <text x="86" y="74" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(56,189,248,0.5)" letter-spacing="1">
    SYS: OPTIMAL // ALL MODULES ACTIVE
  </text>

  <!-- Main title: HAOQI -->
  <text x="450" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="52" font-weight="700" fill="#F4F4F5" letter-spacing="12" filter="url(#glow)">
    HAOQI
  </text>
  
  <!-- Decorative line under title -->
  <line x1="280" y1="155" x2="620" y2="155" stroke="rgba(0,229,255,0.3)" stroke-width="1"/>
  <circle cx="280" cy="155" r="2" fill="rgba(0,229,255,0.5)"/>
  <circle cx="620" cy="155" r="2" fill="rgba(0,229,255,0.5)"/>
  
  <!-- Subtitle -->
  <text x="450" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="rgba(56,189,248,0.7)" letter-spacing="6">
    MATHEMATICAL COMPUTATION ENGINE
  </text>

  <!-- Version badge -->
  <rect x="355" y="195" width="190" height="22" rx="2" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.2)" stroke-width="0.5"/>
  <text x="450" y="210" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="rgba(56,189,248,0.6)" letter-spacing="2">
    v3.4 · RELEASE-STABLE
  </text>

  <!-- Bottom telemetry line -->
  <line x1="60" y1="258" x2="840" y2="258" stroke="rgba(56,189,248,0.08)" stroke-width="0.5"/>
  
  <!-- Bottom specs -->
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="rgba(56,189,248,0.35)" letter-spacing="1">
    <text x="72" y="278">KERNEL: 64-BIT IEEE-754</text>
    <text x="300" y="278">ENGINE: MATH.JS</text>
    <text x="490" y="278">PRECISION: MICROSECOND</text>
    <text x="710" y="278">AUDIO: WEB API</text>
  </g>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="320" fill="url(#scanGrad)" opacity="0.5">
    <animate attributeName="y" from="-320" to="320" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
